<svg width="1200" height="540" viewBox="0 0 1200 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Final transmission</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080808"/><stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B99A4E"/><stop offset="100%" stop-color="#E8D394"/>
    </linearGradient>
    <style>
      <![CDATA[
        .mono { font-family: ui-monospace, "SFMono-Regular", monospace; letter-spacing: 3px; }
        .serif { font-family: Georgia, serif; fill: #F5F2EA; font-weight: 500; }
        @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
        #l1 { opacity: 0; animation: reveal 0.6s ease-out 0.2s forwards; }
        #l2 { opacity: 0; animation: reveal 0.6s ease-out 0.45s forwards; }
        #l3 { opacity: 0; animation: reveal 0.6s ease-out 0.7s forwards; }
        #sub  { opacity: 0; animation: reveal 0.6s ease-out 1.1s forwards; }
        #close{ opacity: 0; animation: reveal 0.6s ease-out 1.4s forwards; }
        #meta { opacity: 0; animation: reveal 0.6s ease-out 1.7s forwards; }
        #dot  { animation: pulse 3s ease-in-out infinite; animation-delay: 2s; }
      ]]>
    </style>
  </defs>
  <rect width="1200" height="540" fill="url(#bg)"/>
  <rect x="30" y="30" width="1140" height="480" fill="none" stroke="#F5F2EA" stroke-opacity="0.06"/>

  <text id="l1" x="60" y="150" class="serif" font-size="58" letter-spacing="1">THE NEXT SYSTEM</text>
  <text id="l2" x="60" y="216" class="serif" font-size="58" letter-spacing="1">IS ALREADY</text>
  <text id="l3" x="60" y="282" class="serif" font-size="58" letter-spacing="1" fill="url(#gold)">UNDER ATTACK.</text>

  <text id="sub" x="60" y="326" class="mono" font-size="26" fill="#A6A39B">LET'S BUILD IT LIKE WE KNOW THAT.</text>

  <text id="close" x="60" y="380" class="mono" font-size="26" letter-spacing="4" fill="#F5F2EA">
    <tspan id="dot" fill="url(#gold)">&#9679;</tspan>&#8202;&#8202;BUILD WHAT OTHERS TRUST.
  </text>

  <g id="meta" class="mono" font-size="13" fill="#55534E">
    <text x="60" y="436">KRISH GAJERA</text>
    <text x="60" y="458" fill="#A6A39B">SECURITY ENGINEERING&#8202;&#8202;&#8226;&#8202;&#8202;CYBERSECURITY &#215; AI</text>
    <text x="60" y="480">SURAT, INDIA&#8202;&#8202;&#8226;&#8202;&#8202;KG&#8202;/&#8202;2026</text>
  </g>

  <g stroke="url(#gold)" stroke-width="1.6" fill="none" opacity="0">
    <animate attributeName="opacity" from="0" to="0.9" begin="1.3s" dur="0.5s" fill="freeze"/>
    <circle cx="1100" cy="120" r="34"/>
    <path d="M1088 106 V134 M1088 120 L1100 106 M1088 120 L1100 134"/>
    <path d="M1104 112 A9 9 0 1 0 1104 128" />
    <path d="M1104 120 H1110"/>
  </g>
</svg>
