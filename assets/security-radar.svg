<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Security radar</title>
  <defs>
    <radialGradient id="sweep" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#E8D394" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8D394" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B99A4E"/><stop offset="100%" stop-color="#E8D394"/>
    </linearGradient>
    <clipPath id="radarClip"><circle cx="600" cy="230" r="168"/></clipPath>
    <style>
      <![CDATA[
        .mono { font-family: ui-monospace, "SFMono-Regular", monospace; letter-spacing: 3px; font-size: 12px; fill: #A6A39B; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        #beam { transform-origin: 600px 230px; animation: spin 9s linear infinite; }
        @keyframes fadeInOut { 0% { opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes fadeInHold { from { opacity: 0; } to { opacity: 1; } }
        #s-detected { opacity: 0; animation: fadeInOut 1.0s ease-in-out 1.0s forwards; }
        #s-analyzed { opacity: 0; animation: fadeInOut 1.0s ease-in-out 2.0s forwards; }
        #s-contained{ opacity: 0; animation: fadeInHold 0.5s ease-in-out 3.0s forwards; }
      ]]>
    </style>
  </defs>
  <rect width="1200" height="460" fill="#050505"/>
  <text x="60" y="46" class="mono" fill="#55534E">RADAR&#8202;/&#8202;THREAT SURFACE</text>

  <circle cx="600" cy="230" r="168" fill="none" stroke="#F5F2EA" stroke-opacity="0.1"/>
  <circle cx="600" cy="230" r="112" fill="none" stroke="#F5F2EA" stroke-opacity="0.07"/>
  <circle cx="600" cy="230" r="56" fill="none" stroke="#F5F2EA" stroke-opacity="0.07"/>
  <line x1="600" y1="62" x2="600" y2="398" stroke="#F5F2EA" stroke-opacity="0.06"/>
  <line x1="432" y1="230" x2="768" y2="230" stroke="#F5F2EA" stroke-opacity="0.06"/>

  <g id="beam" clip-path="url(#radarClip)">
    <path d="M600 230 L600 62 A168 168 0 0 1 745 145 Z" fill="url(#sweep)"/>
  </g>

  <g class="mono" text-anchor="middle">
    <text x="600" y="50">NETWORK</text>
    <text x="600" y="422">TELEMETRY</text>
    <text x="790" y="140" text-anchor="start">IDENTITY</text>
    <text x="410" y="140" text-anchor="end">INTELLIGENCE</text>
    <text x="790" y="326" text-anchor="start">APPLICATION</text>
    <text x="410" y="326" text-anchor="end">INFRASTRUCTURE</text>
  </g>

  <circle cx="600" cy="230" r="0" fill="#0B0B0B" stroke="url(#gold)" stroke-width="1.6"><animate attributeName="r" from="0" to="24" begin="0.3s" dur="0.4s" fill="freeze"/></circle>
  <text x="600" y="235" text-anchor="middle" class="mono" font-size="13" fill="#F5F2EA" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.4s" fill="freeze"/>KG</text>

  <!-- threat node lifecycle -->
  <circle cx="700" cy="175" r="0" fill="url(#gold)"><animate attributeName="r" from="0" to="4" begin="0.9s" dur="0.3s" fill="freeze"/></circle>
  <text id="s-detected"  x="716" y="172" class="mono" font-size="10" fill="#E8D394">DETECTED</text>
  <text id="s-analyzed"  x="716" y="172" class="mono" font-size="10" fill="#E8D394">ANALYZED</text>
  <text id="s-contained" x="716" y="172" class="mono" font-size="10" fill="#A6A39B">CONTAINED</text>
</svg>
