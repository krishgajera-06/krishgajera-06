<svg width="1200" height="440" viewBox="0 0 1200 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>01 / Identity</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B99A4E"/><stop offset="100%" stop-color="#E8D394"/>
    </linearGradient>
    <style>
      <![CDATA[
        .mono { font-family: ui-monospace, "SFMono-Regular", monospace; letter-spacing: 5px; }
        .serif { font-family: Georgia, serif; font-weight: 500; }
        @keyframes reveal { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        #eb { opacity: 0; animation: reveal 0.5s ease-out 0.1s forwards; }
        #l1 { opacity: 0; animation: reveal 0.55s ease-out 0.35s forwards; }
        #l2 { opacity: 0; animation: reveal 0.55s ease-out 0.65s forwards; }
        #l3 { opacity: 0; animation: reveal 0.55s ease-out 0.95s forwards; }
      ]]>
    </style>
  </defs>
  <rect width="1200" height="440" fill="#050505"/>
  <text id="eb" x="60" y="60" class="mono" font-size="12" fill="#55534E">01&#8202;/&#8202;IDENTITY</text>
  <line x1="60" y1="78" x2="140" y2="78" stroke="#D6B96E" stroke-opacity="0.5"/>

  <text id="l1" x="60" y="188" class="serif" font-size="56" fill="#F5F2EA">SECURITY IS NOT A FEATURE.</text>
  <text id="l2" x="60" y="278" class="serif" font-size="56" fill="url(#gold)">IT IS AN ENGINEERING</text>
  <text id="l3" x="60" y="350" class="serif" font-size="56" fill="url(#gold)">DISCIPLINE.</text>
</svg>
