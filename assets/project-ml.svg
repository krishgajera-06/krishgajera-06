<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Project 03 — Student Performance Predictor</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B99A4E"/><stop offset="100%" stop-color="#E8D394"/>
    </linearGradient>
    <style>
      <![CDATA[
        .mono { font-family: ui-monospace, "SFMono-Regular", monospace; letter-spacing: 3px; }
        .serif { font-family: Georgia, serif; fill: #F5F2EA; }
        @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
        #eyebrow { opacity: 0; animation: reveal 0.5s ease-out 0.1s forwards; }
        #title1  { opacity: 0; animation: reveal 0.55s ease-out 0.35s forwards; }
        #title2  { opacity: 0; animation: reveal 0.55s ease-out 0.55s forwards; }
        #line    { opacity: 0; animation: reveal 0.5s ease-out 0.85s forwards; }
      ]]>
    </style>
  </defs>
  <rect width="1200" height="360" fill="#050505"/>
  <rect x="24" y="24" width="1152" height="312" fill="none" stroke="#F5F2EA" stroke-opacity="0.06"/>

  <text id="eyebrow" x="60" y="66" class="mono" font-size="12" fill="#55534E">03&#8202;/&#8202;MACHINE INTELLIGENCE</text>
  <text id="title1" x="60" y="146" class="serif" font-size="56" font-weight="500" letter-spacing="1">STUDENT</text>
  <text id="title2" x="60" y="206" class="serif" font-size="56" font-weight="500" letter-spacing="1" fill="url(#gold)">PERFORMANCE</text>
  <text id="line" x="60" y="256" class="mono" font-size="24" fill="#A6A39B">DATA&#8202;&#8202;&#8594;&#8202;&#8202;SIGNAL&#8202;&#8202;&#8594;&#8202;&#8202;PREDICTION</text>

  <g fill="#55534E">
    <circle cx="960" cy="110" r="0"><animate attributeName="r" from="0" to="3" begin="0.5s" dur="0.3s" fill="freeze"/></circle>
    <circle cx="960" cy="150" r="0"><animate attributeName="r" from="0" to="3" begin="0.55s" dur="0.3s" fill="freeze"/></circle>
    <circle cx="960" cy="190" r="0"><animate attributeName="r" from="0" to="3" begin="0.6s" dur="0.3s" fill="freeze"/></circle>
    <circle cx="960" cy="230" r="0"><animate attributeName="r" from="0" to="3" begin="0.65s" dur="0.3s" fill="freeze"/></circle>
    <circle cx="960" cy="270" r="0"><animate attributeName="r" from="0" to="3" begin="0.7s" dur="0.3s" fill="freeze"/></circle>
  </g>
  <g stroke="#D6B96E" stroke-opacity="0.4" stroke-width="1">
    <line x1="960" y1="110" x2="1080" y2="190" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" begin="0.9s" dur="0.4s" fill="freeze"/></line>
    <line x1="960" y1="150" x2="1080" y2="190" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" begin="0.95s" dur="0.4s" fill="freeze"/></line>
    <line x1="960" y1="190" x2="1080" y2="190" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" begin="1.0s" dur="0.4s" fill="freeze"/></line>
    <line x1="960" y1="230" x2="1080" y2="190" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" begin="1.05s" dur="0.4s" fill="freeze"/></line>
    <line x1="960" y1="270" x2="1080" y2="190" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" begin="1.1s" dur="0.4s" fill="freeze"/></line>
  </g>
  <path d="M1080 190 L1150 190 M1136 176 L1150 190 L1136 204" fill="none" stroke="url(#gold)" stroke-width="1.8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.4s" fill="freeze"/></path>

</svg>
