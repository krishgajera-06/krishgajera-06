<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Active protocols</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B99A4E"/><stop offset="100%" stop-color="#E8D394"/>
    </linearGradient>
    <style>
      <![CDATA[
        .mono { font-family: ui-monospace, "SFMono-Regular", monospace; }
        .lbl { fill: #F5F2EA; font-size: 18px; letter-spacing: 2px; font-weight: 600; }
      ]]>
    </style>
  </defs>
  <rect width="1200" height="300" fill="#050505"/>
  <text x="60" y="46" class="mono" font-size="12" fill="#55534E" letter-spacing="5">ACTIVE&#8202;/&#8202;PROTOCOLS</text>
  <line x1="60" y1="62" x2="1140" y2="62" stroke="#F5F2EA" stroke-opacity="0.08"/>

  <g class="mono">
    <text x="60" y="94" class="lbl">OFFENSIVE SECURITY</text>
    <rect x="60" y="110" width="1080" height="4" rx="2" fill="#1A1A17"/>
    <rect x="60" y="110" width="0" height="4" rx="2" fill="url(#gold)">
      <animate attributeName="width" from="0" to="885" begin="0.30s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
    </rect>
    <circle cx="60" cy="112" r="3.5" fill="#E8D394" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" begin="0.30s" dur="0.7s" fill="freeze"/>
      <animate attributeName="cx" from="60" to="945" begin="0.30s" dur="0.65s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
    </circle>
  </g>
  <g class="mono">
    <text x="60" y="148" class="lbl">WEB / BUG BOUNTY</text>
    <rect x="60" y="164" width="1080" height="4" rx="2" fill="#1A1A17"/>
    <rect x="60" y="164" width="0" height="4" rx="2" fill="url(#gold)">
      <animate attributeName="width" from="0" to="540" begin="0.50s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
    </rect>
    <circle cx="60" cy="166" r="3.5" fill="#E8D394" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" begin="0.50s" dur="0.7s" fill="freeze"/>
      <animate attributeName="cx" from="60" to="600" begin="0.50s" dur="0.65s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
    </circle>
  </g>
  <g class="mono">
    <text x="60" y="202" class="lbl">AI SECURITY</text>
    <rect x="60" y="218" width="1080" height="4" rx="2" fill="#1A1A17"/>
    <rect x="60" y="218" width="0" height="4" rx="2" fill="url(#gold)">
      <animate attributeName="width" from="0" to="734" begin="0.70s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
    </rect>
    <circle cx="60" cy="220" r="3.5" fill="#E8D394" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" begin="0.70s" dur="0.7s" fill="freeze"/>
      <animate attributeName="cx" from="60" to="794" begin="0.70s" dur="0.65s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
    </circle>
  </g>
  <g class="mono">
    <text x="60" y="256" class="lbl">SECURITY ENGINEERING</text>
    <rect x="60" y="272" width="1080" height="4" rx="2" fill="#1A1A17"/>
    <rect x="60" y="272" width="0" height="4" rx="2" fill="url(#gold)">
      <animate attributeName="width" from="0" to="918" begin="0.90s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
    </rect>
    <circle cx="60" cy="274" r="3.5" fill="#E8D394" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" begin="0.90s" dur="0.7s" fill="freeze"/>
      <animate attributeName="cx" from="60" to="978" begin="0.90s" dur="0.65s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
    </circle>
  </g>
</svg>
