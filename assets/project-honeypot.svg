<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Project 01 — IoT Deception Honeypot</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B99A4E"/><stop offset="100%" stop-color="#E8D394"/>
    </linearGradient>
    <style>
      <![CDATA[
        .mono { font-family: ui-monospace, "SFMono-Regular", monospace; letter-spacing: 3px; }
        .serif { font-family: Georgia, serif; fill: #F5F2EA; }
        @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
        #eyebrow { opacity: 0; animation: reveal 0.5s ease-out 0.1s forwards; }
        #title1  { opacity: 0; animation: reveal 0.55s ease-out 0.35s forwards; }
        #title2  { opacity: 0; animation: reveal 0.55s ease-out 0.55s forwards; }
        #line    { opacity: 0; animation: reveal 0.5s ease-out 0.85s forwards; }
        #meta    { opacity: 0; animation: reveal 0.5s ease-out 1.1s forwards; }
      ]]>
    </style>
  </defs>
  <rect width="1200" height="360" fill="#050505"/>
  <rect x="24" y="24" width="1152" height="312" fill="none" stroke="#F5F2EA" stroke-opacity="0.06"/>

  <text id="eyebrow" x="60" y="66" class="mono" font-size="12" fill="#55534E">01&#8202;/&#8202;DECEPTION SYSTEM</text>
  <text id="title1" x="60" y="146" class="serif" font-size="56" font-weight="500" letter-spacing="1">IOT DECEPTION</text>
  <text id="title2" x="60" y="206" class="serif" font-size="56" font-weight="500" letter-spacing="1" fill="url(#gold)">HONEYPOT</text>
  <text id="line" x="60" y="248" class="mono" font-size="13" fill="#A6A39B">ATTACK.&#8202;&#8202;OBSERVE.&#8202;&#8202;UNDERSTAND.</text>
  <text id="meta" x="60" y="320" class="mono" font-size="11" fill="#55534E" letter-spacing="4">COWRIE&#8202;&#8202;&#8226;&#8202;&#8202;DOCKER&#8202;&#8202;&#8226;&#8202;&#8202;GRAFANA&#8202;&#8202;&#8226;&#8202;&#8202;LOKI</text>

  <g stroke="#D6B96E" stroke-opacity="0.45" stroke-width="1">
    <line x1="960" y1="180" x2="1080" y2="90"  pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" begin="0.6s" dur="0.4s" fill="freeze"/></line>
    <line x1="960" y1="180" x2="1120" y2="150" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" begin="0.75s" dur="0.4s" fill="freeze"/></line>
    <line x1="960" y1="180" x2="1100" y2="240" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" begin="0.9s" dur="0.4s" fill="freeze"/></line>
    <line x1="960" y1="180" x2="1050" y2="290" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" begin="1.05s" dur="0.4s" fill="freeze"/></line>
  </g>
  <g fill="#55534E">
    <circle cx="1080" cy="90" r="0"><animate attributeName="r" from="0" to="4" begin="0.6s" dur="0.3s" fill="freeze"/></circle>
    <circle cx="1120" cy="150" r="0"><animate attributeName="r" from="0" to="4" begin="0.75s" dur="0.3s" fill="freeze"/></circle>
    <circle cx="1100" cy="240" r="0"><animate attributeName="r" from="0" to="4" begin="0.9s" dur="0.3s" fill="freeze"/></circle>
    <circle cx="1050" cy="290" r="0"><animate attributeName="r" from="0" to="4" begin="1.05s" dur="0.3s" fill="freeze"/></circle>
  </g>
  <circle cx="960" cy="180" r="0" fill="none" stroke="url(#gold)" stroke-width="1.6"><animate attributeName="r" from="0" to="30" begin="1.3s" dur="0.4s" fill="freeze"/></circle>
  <circle cx="960" cy="180" r="0" fill="none" stroke="#D6B96E" stroke-opacity="0.4" stroke-width="1"><animate attributeName="r" from="30" to="70" begin="1.6s" dur="1s" fill="freeze"/><animate attributeName="opacity" values="0.4;0" begin="1.6s" dur="1s" fill="freeze"/></circle>

</svg>
