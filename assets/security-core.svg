<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Security Architecture — Core Systems Map</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08090B"/>
      <stop offset="100%" stop-color="#050607"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F1D98A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F1D98A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C7A95A"/>
      <stop offset="100%" stop-color="#F1D98A"/>
    </linearGradient>
    <style>
      <![CDATA[
        .node-label { font-family: "SFMono-Regular", ui-monospace, "Courier New", monospace; font-size: 12px; letter-spacing: 2.5px; fill: #B8B6AE; }
        @keyframes corePulse { 0%,100% { r: 30px; opacity: 0.9; } 50% { r: 34px; opacity: 1; } }
        #core-inner { animation: corePulse 3.6s ease-in-out infinite; animation-delay: 2.1s; }
      ]]>
    </style>
  </defs>

  <rect width="1200" height="500" fill="url(#bg2)"/>
  <rect x="30" y="30" width="1140" height="440" fill="none" stroke="#F4F1E8" stroke-opacity="0.07" stroke-width="1"/>
  <text x="60" y="64" class="node-label" fill="#777770">SECURITY ARCHITECTURE&#8202;/&#8202;LIVE MAP</text>

  <!-- connections, each drawn once, staggered -->
  <g stroke="#E6C875" stroke-opacity="0.5" stroke-width="1.1" fill="none">
    <line x1="600" y1="250" x2="600" y2="70"  pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" begin="0.5s" dur="0.4s" fill="freeze"/></line>
    <line x1="600" y1="250" x2="758" y2="163" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" begin="0.8s" dur="0.4s" fill="freeze"/></line>
    <line x1="600" y1="250" x2="758" y2="337" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" begin="1.1s" dur="0.4s" fill="freeze"/></line>
    <line x1="600" y1="250" x2="600" y2="430" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" begin="1.4s" dur="0.4s" fill="freeze"/></line>
    <line x1="600" y1="250" x2="442" y2="337" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" begin="1.7s" dur="0.4s" fill="freeze"/></line>
    <line x1="600" y1="250" x2="442" y2="163" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" begin="2.0s" dur="0.4s" fill="freeze"/></line>
  </g>

  <!-- traveling packets, subtle + slow, start once network is fully drawn -->
  <g fill="#F1D98A">
    <circle r="2.2" opacity="0.7">
      <animateMotion path="M600 250 L600 70" begin="2.6s" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.2" opacity="0.7">
      <animateMotion path="M600 250 L758 337" begin="3.3s" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.2" opacity="0.7">
      <animateMotion path="M600 250 L442 163" begin="4.1s" dur="3.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- outer nodes -->
  <g>
    <!-- ATTACK SURFACE (top) -->
    <circle cx="600" cy="70" r="0" fill="url(#gold2)"><animate attributeName="r" from="0" to="6" begin="0.4s" dur="0.3s" fill="freeze"/></circle>
    <text x="600" y="46" text-anchor="middle" class="node-label" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.3s" fill="freeze"/>ATTACK SURFACE</text>

    <!-- IDENTITY (upper right) -->
    <circle cx="758" cy="163" r="0" fill="url(#gold2)"><animate attributeName="r" from="0" to="6" begin="0.7s" dur="0.3s" fill="freeze"/></circle>
    <text x="778" y="158" class="node-label" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.3s" fill="freeze"/>IDENTITY</text>

    <!-- NETWORK (lower right) -->
    <circle cx="758" cy="337" r="0" fill="url(#gold2)"><animate attributeName="r" from="0" to="6" begin="1.0s" dur="0.3s" fill="freeze"/></circle>
    <text x="778" y="342" class="node-label" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.3s" fill="freeze"/>NETWORK</text>

    <!-- TELEMETRY (bottom) -->
    <circle cx="600" cy="430" r="0" fill="url(#gold2)"><animate attributeName="r" from="0" to="6" begin="1.3s" dur="0.3s" fill="freeze"/></circle>
    <text x="600" y="456" text-anchor="middle" class="node-label" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.3s" fill="freeze"/>TELEMETRY</text>

    <!-- AUTOMATION (lower left) -->
    <circle cx="442" cy="337" r="0" fill="url(#gold2)"><animate attributeName="r" from="0" to="6" begin="1.6s" dur="0.3s" fill="freeze"/></circle>
    <text x="422" y="342" text-anchor="end" class="node-label" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.3s" fill="freeze"/>AUTOMATION</text>

    <!-- INTELLIGENCE (upper left) -->
    <circle cx="442" cy="163" r="0" fill="url(#gold2)"><animate attributeName="r" from="0" to="6" begin="1.9s" dur="0.3s" fill="freeze"/></circle>
    <text x="422" y="158" text-anchor="end" class="node-label" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.3s" fill="freeze"/>INTELLIGENCE</text>
  </g>

  <!-- scanning ring, expands once when core activates -->
  <circle cx="600" cy="250" r="30" fill="none" stroke="#E6C875" stroke-width="1" opacity="0">
    <animate attributeName="r" from="30" to="220" begin="2.3s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.3 1"/>
    <animate attributeName="opacity" values="0;0.6;0" keyTimes="0;0.15;1" begin="2.3s" dur="1.1s" fill="freeze"/>
  </circle>

  <!-- central core -->
  <circle cx="600" cy="250" r="60" fill="url(#coreGlow)" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.5s" fill="freeze"/></circle>
  <circle id="core-inner" cx="600" cy="250" r="0" fill="#0D0F12" stroke="url(#gold2)" stroke-width="1.6">
    <animate attributeName="r" from="0" to="30" begin="2.1s" dur="0.4s" fill="freeze"/>
  </circle>
  <text x="600" y="255" text-anchor="middle" class="node-label" font-size="10" fill="#F4F1E8" opacity="0" letter-spacing="1.5">
    <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.4s" fill="freeze"/>CORE
  </text>
</svg>
