<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Engineering philosophy</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B99A4E"/><stop offset="100%" stop-color="#E8D394"/>
    </linearGradient>
    <style>
      <![CDATA[
        .mono { font-family: ui-monospace, "SFMono-Regular", monospace; letter-spacing: 5px; }
        .serif { font-family: Georgia, serif; font-weight: 500; fill: #F5F2EA; }
        @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
        #l1 { opacity: 0; animation: reveal 0.5s ease-out 0.2s forwards; }
        #l2 { opacity: 0; animation: reveal 0.5s ease-out 0.5s forwards; }
        #l3 { opacity: 0; animation: reveal 0.5s ease-out 0.8s forwards; }
      ]]>
    </style>
  </defs>
  <rect width="1200" height="400" fill="#050505"/>
  <text x="60" y="60" class="mono" font-size="12" fill="#55534E">PRINCIPLES</text>
  <line x1="60" y1="78" x2="140" y2="78" stroke="#D6B96E" stroke-opacity="0.5"/>

  <text id="l1" x="60" y="168" class="serif" font-size="52"><tspan fill="url(#gold)">UNDERSTAND</tspan> THE ATTACK.</text>
  <text id="l2" x="60" y="240" class="serif" font-size="52"><tspan fill="url(#gold)">ENGINEER</tspan> THE DEFENSE.</text>
  <text id="l3" x="60" y="312" class="serif" font-size="52"><tspan fill="url(#gold)">AUTOMATE</tspan> THE REST.</text>
</svg>
