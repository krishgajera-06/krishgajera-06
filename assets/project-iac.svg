<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Project 04 — Enterprise IaC Pipeline</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B99A4E"/><stop offset="100%" stop-color="#E8D394"/>
    </linearGradient>
    <style>
      <![CDATA[
        .mono { font-family: ui-monospace, "SFMono-Regular", monospace; letter-spacing: 3px; }
        .serif { font-family: Georgia, serif; fill: #F5F2EA; }
        @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
        #eyebrow { opacity: 0; animation: reveal 0.5s ease-out 0.1s forwards; }
        #title1  { opacity: 0; animation: reveal 0.55s ease-out 0.35s forwards; }
        #title2  { opacity: 0; animation: reveal 0.55s ease-out 0.55s forwards; }
        #line    { opacity: 0; animation: reveal 0.5s ease-out 0.85s forwards; }
        #meta    { opacity: 0; animation: reveal 0.5s ease-out 1.1s forwards; }
      ]]>
    </style>
  </defs>
  <rect width="1200" height="360" fill="#050505"/>
  <rect x="24" y="24" width="1152" height="312" fill="none" stroke="#F5F2EA" stroke-opacity="0.06"/>

  <text id="eyebrow" x="60" y="66" class="mono" font-size="12" fill="#55534E">04&#8202;/&#8202;INFRASTRUCTURE</text>
  <text id="title1" x="60" y="146" class="serif" font-size="56" font-weight="500" letter-spacing="1">ENTERPRISE</text>
  <text id="title2" x="60" y="206" class="serif" font-size="56" font-weight="500" letter-spacing="1" fill="url(#gold)">IaC PIPELINE</text>
  <text id="line" x="60" y="248" class="mono" font-size="13" fill="#A6A39B">INFRASTRUCTURE AS&#8202;&#8202;VERSIONED SYSTEMS.</text>
  <text id="meta" x="60" y="320" class="mono" font-size="11" fill="#55534E" letter-spacing="4">DOCKER&#8202;&#8202;&#8226;&#8202;&#8202;GITHUB ACTIONS&#8202;&#8202;&#8226;&#8202;&#8202;CI/CD</text>
<g><line x1="968" y1="200" x2="1012" y2="200" stroke="#D6B96E" stroke-opacity="0.35" stroke-width="1.2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" begin="0.60s" dur="0.35s" fill="freeze"/></line>
<line x1="1028" y1="200" x2="1072" y2="200" stroke="#D6B96E" stroke-opacity="0.35" stroke-width="1.2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" begin="0.75s" dur="0.35s" fill="freeze"/></line>
<line x1="1088" y1="200" x2="1132" y2="200" stroke="#D6B96E" stroke-opacity="0.35" stroke-width="1.2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" begin="0.90s" dur="0.35s" fill="freeze"/></line>
<rect x="952" y="192" width="16" height="16" rx="3" fill="#3A392F" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.40s" dur="0.3s" fill="freeze"/></rect>
<text x="960" y="230" text-anchor="middle" class="mono" font-size="9" fill="#55534E" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.50s" dur="0.3s" fill="freeze"/>PLAN</text>
<rect x="1012" y="192" width="16" height="16" rx="3" fill="#3A392F" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.3s" fill="freeze"/></rect>
<text x="1020" y="230" text-anchor="middle" class="mono" font-size="9" fill="#55534E" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.3s" fill="freeze"/>BUILD</text>
<rect x="1072" y="192" width="16" height="16" rx="3" fill="#3A392F" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.70s" dur="0.3s" fill="freeze"/></rect>
<text x="1080" y="230" text-anchor="middle" class="mono" font-size="9" fill="#55534E" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.80s" dur="0.3s" fill="freeze"/>TEST</text>
<rect x="1132" y="192" width="16" height="16" rx="3" fill="url(#gold)" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.85s" dur="0.3s" fill="freeze"/></rect>
<text x="1140" y="230" text-anchor="middle" class="mono" font-size="9" fill="#55534E" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.95s" dur="0.3s" fill="freeze"/>SHIP</text>
</g>
</svg>
