<svg width="1200" height="440" viewBox="0 0 1200 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>03 / Verified credentials</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B99A4E"/><stop offset="100%" stop-color="#E8D394"/>
    </linearGradient>
    <style>
      <![CDATA[
        .mono { font-family: ui-monospace, "SFMono-Regular", monospace; }
        .title { fill: #F5F2EA; font-size: 32px; font-weight: 600; letter-spacing: 1px; }
        .tag   { fill: #A6A39B; font-size: 14px; letter-spacing: 3px; }
        .dom   { fill: #7A7870; font-size: 16px; letter-spacing: 1px; }
        @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
        #c1 { opacity: 0; animation: reveal 0.5s ease-out 0.3s forwards; }
        #c2 { opacity: 0; animation: reveal 0.5s ease-out 0.7s forwards; }
      ]]>
    </style>
  </defs>
  <rect width="1200" height="440" fill="#050505"/>
  <text x="60" y="52" class="mono" font-size="12" fill="#55534E" letter-spacing="5">03&#8202;/&#8202;VERIFIED</text>

  <g id="c1">
    <line x1="60" y1="86" x2="1140" y2="86" stroke="#F5F2EA" stroke-opacity="0.08"/>
    <text x="60" y="146" class="mono title">GOOGLE CYBERSECURITY</text>
    <text x="1140" y="146" text-anchor="end" class="mono tag" fill="url(#gold)">STATUS&#8202;/&#8202;COMPLETED</text>
    <text x="60" y="180" class="mono dom">SECURITY &#183; NETWORKING &#183; LINUX &#183; INCIDENT RESPONSE</text>
  </g>

  <g id="c2">
    <line x1="60" y1="240" x2="1140" y2="240" stroke="#F5F2EA" stroke-opacity="0.08"/>
    <text x="60" y="300" class="mono title">INFOTACT SOLUTIONS</text>
    <text x="1140" y="300" text-anchor="end" class="mono tag" fill="url(#gold)">CYBERSECURITY&#8202;/&#8202;INTERNSHIP</text>
    <text x="60" y="334" class="mono dom">DECEPTION &#183; MONITORING &#183; INFRASTRUCTURE &#183; THREAT ANALYSIS</text>
    <line x1="60" y1="394" x2="1140" y2="394" stroke="#F5F2EA" stroke-opacity="0.08"/>
  </g>
</svg>
