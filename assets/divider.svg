<svg width="1200" height="40" viewBox="0 0 1200 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dgrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D0F12" stop-opacity="0"/>
      <stop offset="45%" stop-color="#C7A95A" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#F1D98A" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#C7A95A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0D0F12" stop-opacity="0"/>
    </linearGradient>
    <style>
      <![CDATA[
        @keyframes shimmerLine { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
        #dline { animation: shimmerLine 5s ease-in-out infinite; }
      ]]>
    </style>
  </defs>
  <line id="dline" x1="0" y1="20" x2="1200" y2="20" stroke="url(#dgrad)" stroke-width="1"/>
  <rect x="596" y="16" width="8" height="8" fill="#0D0F12" stroke="#E6C875" stroke-width="1" transform="rotate(45 600 20)"/>
