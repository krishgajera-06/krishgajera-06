<svg width="1200" height="550" viewBox="0 0 1200 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Trajectory</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B99A4E"/><stop offset="100%" stop-color="#E8D394"/>
    </linearGradient>
    <style>
      <![CDATA[
        .mono { font-family: ui-monospace, "SFMono-Regular", monospace; letter-spacing: 3px; }
        .step { fill: #F5F2EA; font-size: 20px; font-weight: 600; }
        .step-final { fill: url(#gold); font-size: 22px; font-weight: 700; }
      ]]>
    </style>
  </defs>
  <rect width="1200" height="550" fill="#050505"/>
  <text x="60" y="46" class="mono" font-size="12" fill="#55534E">TRAJECTORY</text>
<line x1="600" y1="90" x2="600" y2="90" stroke="url(#gold)" stroke-width="1.6"><animate attributeName="y2" from="90" to="490" begin="0.3s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/></line>
<circle cx="600" cy="90" r="0" fill="url(#gold)"><animate attributeName="r" from="0" to="4" begin="0.30s" dur="0.3s" fill="freeze"/></circle>
<text x="626" y="97" class="mono step" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.30s" dur="0.4s" fill="freeze"/>COMPUTER ENGINEERING</text>
<circle cx="600" cy="170" r="0" fill="url(#gold)"><animate attributeName="r" from="0" to="4" begin="0.54s" dur="0.3s" fill="freeze"/></circle>
<text x="626" y="177" class="mono step" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.54s" dur="0.4s" fill="freeze"/>CYBERSECURITY</text>
<circle cx="600" cy="250" r="0" fill="url(#gold)"><animate attributeName="r" from="0" to="4" begin="0.78s" dur="0.3s" fill="freeze"/></circle>
<text x="626" y="257" class="mono step" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.78s" dur="0.4s" fill="freeze"/>DECEPTION SYSTEMS</text>
<circle cx="600" cy="330" r="0" fill="url(#gold)"><animate attributeName="r" from="0" to="4" begin="1.02s" dur="0.3s" fill="freeze"/></circle>
<text x="626" y="337" class="mono step" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.02s" dur="0.4s" fill="freeze"/>SECURITY AUTOMATION</text>
<circle cx="600" cy="410" r="0" fill="url(#gold)"><animate attributeName="r" from="0" to="4" begin="1.26s" dur="0.3s" fill="freeze"/></circle>
<text x="626" y="417" class="mono step" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.26s" dur="0.4s" fill="freeze"/>AI &#215; CYBERSECURITY</text>
<circle cx="600" cy="490" r="0" fill="url(#gold)"><animate attributeName="r" from="0" to="6" begin="1.50s" dur="0.3s" fill="freeze"/></circle>
<text x="626" y="497" class="mono step-final" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.50s" dur="0.4s" fill="freeze"/>SECURITY ENGINEERING</text>
</svg>
