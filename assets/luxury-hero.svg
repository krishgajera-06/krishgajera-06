<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<defs>
<linearGradient id="gold" x1="0" x2="1"><stop stop-color="#8b6f35"/><stop offset=".35" stop-color="#f4e4b3"/><stop offset=".65" stop-color="#c6a15b"/><stop offset="1" stop-color="#7a5d2b"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#d8b66b" stop-opacity=".12"/><stop offset="1" stop-color="#0a0a0b" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:Georgia,'Times New Roman',serif}.mono{font-family:ui-monospace,Menlo,monospace}
.line{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.6s ease forwards}.fade{opacity:0;animation:fade 1.3s ease forwards}.shine{animation:shine 4s ease-in-out infinite}.dot{animation:pulse 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{to{opacity:1}}@keyframes pulse{50%{opacity:.2}}@keyframes shine{50%{opacity:.65}}
</style>
<rect width="1200" height="430" rx="20" fill="#0a0a0b"/>
<ellipse cx="600" cy="190" rx="420" ry="220" fill="url(#halo)"/>
<path class="line" d="M110 85H1090" stroke="url(#gold)" opacity=".55"/>
<path class="line" d="M110 344H1090" stroke="url(#gold)" opacity=".55" style="animation-delay:.35s"/>
<circle class="dot" cx="110" cy="85" r="3" fill="#e5ca8a"/><circle class="dot" cx="1090" cy="85" r="3" fill="#e5ca8a"/>
<text class="mono fade" x="600" y="125" text-anchor="middle" font-size="12" letter-spacing="6" fill="#9d895d" style="animation-delay:.5s">DIGITAL CRAFT · SECURITY · 2026</text>
<text class="fade" x="600" y="220" text-anchor="middle" font-size="68" letter-spacing="13" fill="url(#gold)" filter="url(#glow)" style="animation-delay:.8s">KRISH GAJERA</text>
<text class="mono fade" x="600" y="267" text-anchor="middle" font-size="15" letter-spacing="5" fill="#d7d0c1" style="animation-delay:1.1s">CYBERSECURITY  /  ENGINEERING  /  AI</text>
<text class="fade shine" x="600" y="314" text-anchor="middle" font-size="17" font-style="italic" letter-spacing="2" fill="#9d895d" style="animation-delay:1.4s">Engineer the unknown.</text>
<text class="mono fade" x="600" y="384" text-anchor="middle" font-size="10" letter-spacing="4" fill="#625b4e" style="animation-delay:1.7s">SURAT · INDIA  —  AVAILABLE ONLINE</text>
</svg>