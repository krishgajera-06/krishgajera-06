<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050506"/><stop offset=".55" stop-color="#0c0d10"/><stop offset="1" stop-color="#050506"/></linearGradient>
 <linearGradient id="metal" x1="0" x2="1"><stop stop-color="#6f6f72"/><stop offset=".22" stop-color="#f4f4f0"/><stop offset=".48" stop-color="#8b8c90"/><stop offset=".72" stop-color="#fff"/><stop offset="1" stop-color="#77787c"/></linearGradient>
 <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#74551f"/><stop offset=".45" stop-color="#e5c16e"/><stop offset=".7" stop-color="#fff0b7"/><stop offset="1" stop-color="#806126"/></linearGradient>
 <radialGradient id="orb"><stop stop-color="#d5b45f" stop-opacity=".2"/><stop offset=".45" stop-color="#8e7132" stop-opacity=".05"/><stop offset="1" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.s{font-family:Arial,Helvetica,sans-serif}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.8s cubic-bezier(.2,.8,.2,1) forwards}
.fade{opacity:0;transform:translateY(10px);animation:fade 1s ease forwards}
.scan{animation:scan 5s ease-in-out infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{to{opacity:1;transform:translateY(0)}}@keyframes pulse{50%{opacity:.35}}
@keyframes scan{0%,100%{transform:translateX(-250px);opacity:0}45%,55%{opacity:.5}50%{transform:translateX(950px)}}
</style>
<rect width="1200" height="620" rx="28" fill="url(#bg)"/>
<circle cx="600" cy="285" r="390" fill="url(#orb)" filter="url(#blur)"/>
<g opacity=".18" stroke="#8c8d91"><path d="M70 110H1130"/><path d="M70 510H1130"/><path d="M155 70V550"/><path d="M1045 70V550"/></g>
<path class="draw" d="M70 70H1130V550H70Z" fill="none" stroke="url(#gold)" stroke-width="1.4" opacity=".7"/>
<g transform="translate(600 172)" filter="url(#glow)">
 <path d="M-64 36V-36M-64-36H-18M-64 0H-22M-18-36L-18 36M18-36V36M18 0L64-36M18 0L64 36" fill="none" stroke="url(#metal)" stroke-width="8" stroke-linecap="square"/>
</g>
<text class="m fade" x="600" y="255" text-anchor="middle" fill="#b99a54" font-size="12" letter-spacing="7" style="animation-delay:.35s">OBSIDIAN SIGNATURE / 2026</text>
<text class="s fade" x="600" y="340" text-anchor="middle" fill="url(#metal)" font-size="72" font-weight="700" letter-spacing="14" style="animation-delay:.65s">KRISH GAJERA</text>
<text class="m fade" x="600" y="390" text-anchor="middle" fill="#c4c4c5" font-size="16" letter-spacing="5" style="animation-delay:.95s">CYBERSECURITY · SOFTWARE ENGINEERING · AI</text>
<text class="m fade" x="600" y="452" text-anchor="middle" fill="#777980" font-size="12" letter-spacing="3" style="animation-delay:1.2s">BUILD SECURE SYSTEMS. STUDY ADVERSARIES. ENGINEER WHAT COMES NEXT.</text>
<circle class="pulse" cx="510" cy="493" r="4" fill="#d7b55e"/><text class="m fade" x="528" y="498" fill="#9b9da2" font-size="11" letter-spacing="2" style="animation-delay:1.45s">SURAT, INDIA</text>
<circle class="pulse" cx="660" cy="493" r="4" fill="#d7b55e"/><text class="m fade" x="678" y="498" fill="#9b9da2" font-size="11" letter-spacing="2" style="animation-delay:1.45s">ONLINE</text>
<rect class="scan" x="0" y="70" width="160" height="480" fill="#fff" opacity="0" transform="skewX(-18)"/>
</svg>