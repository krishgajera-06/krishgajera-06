<svg width="1200" height="650" viewBox="0 0 1200 650" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Krish Gajera — Digital Security Dossier</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="55%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B99A4E"/>
      <stop offset="50%" stop-color="#E8D394"/>
      <stop offset="100%" stop-color="#D6B96E"/>
    </linearGradient>
    <radialGradient id="vign" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0B0B0B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#F5F2EA" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <style>
      <![CDATA[
        .mono { font-family: ui-monospace, "SFMono-Regular", "Courier New", monospace; }
        .serif { font-family: Georgia, "Times New Roman", serif; }
        .label { font-size: 14px; letter-spacing: 2.5px; fill: #55534E; }
        .label-lit { font-size: 14px; letter-spacing: 2.5px; fill: #A6A39B; }

        @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes spinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
        @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
        @keyframes drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

        #m-krish   { opacity: 0; animation: reveal 0.55s ease-out 1.2s forwards; }
        #m-gajera  { opacity: 0; animation: reveal 0.55s ease-out 1.45s forwards; }
        #m-tagline { opacity: 0; animation: reveal 0.6s ease-out 2.0s forwards; }
        #m-meta1   { opacity: 0; animation: reveal 0.4s ease-out 1.8s forwards; }
        #m-meta2   { opacity: 0; animation: reveal 0.4s ease-out 1.92s forwards; }
        #m-meta3   { opacity: 0; animation: reveal 0.4s ease-out 2.04s forwards; }
        #m-verified{ opacity: 0; animation: reveal 0.4s ease-out 2.16s forwards; }
        #m-ring    { opacity: 0; animation: reveal 0.5s ease-out 0.9s forwards; }

        #orbit-out { transform-origin: 950px 300px; animation: spin 34s linear infinite; animation-delay: 2.8s; }
        #orbit-in  { transform-origin: 950px 300px; animation: spinRev 20s linear infinite; animation-delay: 2.8s; }
        #status-dot{ animation: pulse 3.2s ease-in-out infinite; animation-delay: 2.8s; }
        #hair-glow { animation: drift 7s ease-in-out infinite; animation-delay: 2.8s; }
      ]]>
    </style>
  </defs>

  <rect width="1200" height="650" fill="url(#bg)"/>
  <rect width="1200" height="650" fill="url(#grid)"/>
  <rect width="1200" height="650" fill="url(#vign)"/>
  <rect x="30" y="30" width="1140" height="590" fill="none" stroke="#F5F2EA" stroke-opacity="0.06" stroke-width="1"/>

  <circle cx="600" cy="325" r="0" fill="url(#gold)">
    <animate attributeName="r" from="0" to="3" begin="0.2s" dur="0.2s" fill="freeze"/>
  </circle>

  <line id="hair-glow" x1="600" y1="325" x2="600" y2="325" stroke="url(#gold)" stroke-width="1" opacity="0.7">
    <animate attributeName="x1" from="600" to="70" begin="0.4s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
    <animate attributeName="x2" from="600" to="1130" begin="0.4s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
  </line>

  <g class="serif" font-weight="500" fill="#F5F2EA">
    <text id="m-krish" x="70" y="300" font-size="128" letter-spacing="4">KRISH</text>
    <text id="m-gajera" x="70" y="418" font-size="128" letter-spacing="2" fill="url(#gold)">GAJERA</text>
  </g>

  <text id="m-tagline" x="72" y="470" class="mono" font-size="28" letter-spacing="0.5" fill="#A6A39B">I BUILD SYSTEMS <tspan fill="url(#gold)">WORTH DEFENDING.</tspan></text>

  <g class="mono">
    <text id="m-meta1" x="72" y="524" class="label">KG&#8202;/&#8202;ID-0606&#8202;&#8202;&#8226;&#8202;&#8202;CLEARANCE&#8202;/&#8202;SECURITY ENGINEERING</text>
    <text id="m-meta2" x="72" y="550" class="label">LOCATION&#8202;/&#8202;SURAT, INDIA&#8202;&#8202;&#8226;&#8202;&#8202;SYSTEM&#8202;/&#8202;ACTIVE</text>
    <text id="m-meta3" x="72" y="576" class="label">FIELD&#8202;/&#8202;CYBERSECURITY &#215; AI</text>
    <text id="m-verified" x="72" y="606" class="label-lit" letter-spacing="4">
      <tspan id="status-dot" fill="url(#gold)">&#9679;</tspan>&#8202;&#8202;IDENTITY VERIFIED
    </text>
  </g>

  <g id="m-ring">
    <g id="orbit-out">
      <circle cx="950" cy="300" r="150" fill="none" stroke="#D6B96E" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="1 10"/>
    </g>
    <g id="orbit-in">
      <circle cx="950" cy="300" r="112" fill="none" stroke="#D6B96E" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="6 5"/>
    </g>
    <g stroke="#55534E" stroke-width="1">
      <path d="M950 138 V150 M950 450 V462 M788 300 H800 M1100 300 H1112"/>
    </g>
  </g>

  <g stroke="url(#gold)" stroke-width="2.4" fill="none" stroke-linecap="square">
    <path d="M918 262 V338 M918 300 L946 262 M918 300 L946 338" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" begin="0.6s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
    </path>
    <path d="M958 278 A22 22 0 1 0 958 322" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" begin="0.75s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
    </path>
    <path d="M958 300 H974" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" begin="1.05s" dur="0.3s" fill="freeze"/>
    </path>
  </g>
  <rect x="895" y="240" width="110" height="120" fill="none" stroke="#F5F2EA" stroke-opacity="0.12" stroke-width="1" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.4s" fill="freeze"/>
  </rect>

  <rect x="-100" y="30" width="100" height="590" fill="url(#gold)" opacity="0">
    <animate attributeName="opacity" values="0;0.06;0" keyTimes="0;0.5;1" begin="2.4s" dur="0.9s" fill="freeze"/>
    <animate attributeName="x" from="-100" to="1200" begin="2.4s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
  </rect>
</svg>
