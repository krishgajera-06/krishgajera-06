name: Refresh contribution graph

on:
  schedule:
    - cron: "17 3 * * *"   # once daily, off the hour to avoid GitHub's peak-minute queue
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-contributions
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch public contribution data
        run: python scripts/fetch_contributions.py

      - name: Render contributions.svg
        run: python scripts/render_contributions.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg scripts/contributions_data.json
          if git diff --cached --quiet; then
            echo "No change in contribution data — skipping commit."
          else
            git commit -m "chore: refresh contribution graph [skip ci]"
            git push
          fi
